<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nhantumbo MG — Moageira, Xai-Xai">
  <defs>
    <radialGradient id="discGrad" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#3D6FB8"/>
      <stop offset="55%" stop-color="#2C5EA8"/>
      <stop offset="100%" stop-color="#123055"/>
    </radialGradient>
    <path id="arcTop" d="M 21.22,86.11 A 80,80 0 0 1 178.78,86.11" fill="none"/>
    <path id="arcBottom" d="M 21.22,113.89 A 80,80 0 0 0 178.78,113.89" fill="none"/>
  </defs>

  <!-- anel exterior -->
  <circle cx="100" cy="100" r="96" fill="#18243B"/>
  <circle cx="100" cy="100" r="92" fill="url(#discGrad)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#F8FAFD" stroke-width="1" opacity="0.35"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#F8FAFD" stroke-width="1" opacity="0.3"/>

  <!-- texto em arco -->
  <text font-family="'IBM Plex Sans', Arial, sans-serif" font-weight="600" font-size="15.5" letter-spacing="3.4" fill="#F8FAFD">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">NHANTUMBO</textPath>
  </text>
  <text font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="500" font-size="10.5" letter-spacing="2.6" fill="#BFD2EA">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">MOAGEIRA · XAI-XAI</textPath>
  </text>

  <!-- pequenos marcadores entre os arcos -->
  <circle cx="21.22" cy="100" r="2" fill="#F8FAFD" opacity="0.55"/>
  <circle cx="178.78" cy="100" r="2" fill="#F8FAFD" opacity="0.55"/>

  <!-- ícone central: grão a entrar -->
  <g>
    <circle cx="84" cy="50" r="2.5" fill="#F8FAFD"/>
    <circle cx="92" cy="47.5" r="2.5" fill="#F8FAFD"/>
    <circle cx="100" cy="46.5" r="2.8" fill="#F8FAFD"/>
    <circle cx="108" cy="47.5" r="2.5" fill="#F8FAFD"/>
    <circle cx="116" cy="50" r="2.5" fill="#F8FAFD"/>

    <!-- funil -->
    <path d="M79,57 L121,57 L106,85 L94,85 Z" fill="#F8FAFD"/>
    <rect x="95" y="85" width="10" height="13" fill="#F8FAFD"/>

    <!-- farinha -->
    <circle cx="100" cy="102" r="2.6" fill="#F8FAFD"/>
    <circle cx="90" cy="106" r="1.9" fill="#8FADD6"/>
    <circle cx="110" cy="106" r="1.9" fill="#8FADD6"/>
    <circle cx="100" cy="110" r="2" fill="#C97A3B"/>
  </g>

  <line x1="72" y1="122" x2="128" y2="122" stroke="#F8FAFD" stroke-width="1" opacity="0.4"/>

  <!-- monograma MG -->
  <text x="100" y="153" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="2" fill="#F8FAFD" text-anchor="middle">MG</text>
</svg>
